global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "heart-disease-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["heart-disease-api-service:80"]
        labels:
          app: "heart-disease-api"
          environment: "production"
    scrape_interval: 10s
