apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api-service
  namespace: default
  labels:
    app: heart-disease-api
  annotations:
    # GKE: creates a Google Cloud Load Balancer
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
