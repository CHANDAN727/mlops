name: CI/CD - Heart Disease API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PROJECT_ID: project-5e96c14d-9327-4739-aae
  IMAGE: us-central1-docker.pkg.dev/project-5e96c14d-9327-4739-aae/mlops-repo/heart-disease-api
  VM_NAME: mlops-vm
  VM_ZONE: us-central1-c
  WORKLOAD_IDENTITY_PROVIDER: projects/220771761804/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@project-5e96c14d-9327-4739-aae.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Lint & Test
  # ──────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Train Model
  # ──────────────────────────────────────────────────────────────
  train-model:
    name: Train & Log Model
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train model
        run: |
          python -m src.train

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker Image to Artifact Registry
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train-model
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  # ──────────────────────────────────────────────────────────────
  # JOB 4: Deploy to GCP VM
  # ──────────────────────────────────────────────────────────────
  deploy-to-vm:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to VM via SSH
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --quiet \
            --command="
              cd ~/mlops || git clone https://github.com/CHANDAN727/mlops.git ~/mlops
              cd ~/mlops && git pull origin main
              sudo gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
              sudo docker-compose pull
              sudo docker-compose up -d --force-recreate
              sleep 10
              curl -sf http://localhost/health && echo 'Deployment successful!' || echo 'Health check pending...'
            "

      - name: Show URLs
        run: |
          echo "✅ Dashboard:  http://35.238.24.35"
          echo "📡 API Docs:   http://35.238.24.35/docs"
          echo "📊 Grafana:    http://35.238.24.35/grafana/"
          echo "🔍 Prometheus: http://35.238.24.35/prometheus/"
          echo "📈 Metrics:    http://35.238.24.35/metrics"
